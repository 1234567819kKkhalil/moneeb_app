dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  injectable_generator:
  json_serializable: ^6.8.0
  floor_generator: ^1.5.0
  envied_generator: ^1.1.1

flutter:
  # Plugins are integrated through CocoaPods only, matching the Podfile and
  # the CI workflow (some plugins do not build as Swift packages yet).
  config:
    enable-swift-package-manager: false

  generate: true
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/images/map/
    - assets/images/splash/
    - assets/icons/
    - assets/icons/omrah/
    - assets/icons/auth/
    - assets/settings.html

  fonts:
    - family: LamaSans
      fonts:
        - asset: assets/fonts/LamaSans-ExtraBold.ttf
          weight: 900
        - asset: assets/fonts/LamaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/LamaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/LamaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/LamaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/LamaSans-Light.ttf
          weight: 300
    - family: KFGQPC
      fonts:
        - asset: assets/fonts/KFGQPC.otf
