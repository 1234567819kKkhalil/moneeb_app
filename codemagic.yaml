workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 120
    integrations:
      app_store_connect: al gan
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Disable Swift Package Manager (use CocoaPods instead)
        script: flutter config --no-enable-swift-package-manager

      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update

      - name: Generate code
        script: dart run build_runner build --delete-conflicting-outputs

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build iOS
        script: flutter build ipa --release --export-options-plist /Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration